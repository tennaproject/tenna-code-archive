name: "Pinned UTMT Setup"
description: "Build a required UndertaleModTool revision and install viewer dependencies"
inputs:
  utmt-ref:
    required: true
  install-steam:
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Validate UTMT revision
      shell: bash
      env:
        UTMT_REF: ${{ inputs.utmt-ref }}
      run: |
        if [[ ! "$UTMT_REF" =~ ^[0-9a-f]{40}$ ]]; then
          echo "utmt-ref must be an exact 40-character commit" >&2
          exit 1
        fi
    - name: Download steamcmd
      if: inputs.install-steam == 'true'
      shell: sh
      run: |
        sudo add-apt-repository multiverse
        sudo dpkg --add-architecture i386
        sudo apt update
        echo steam steam/question select "I AGREE" | sudo debconf-set-selections
        echo steam steam/license note '' | sudo debconf-set-selections
        sudo apt install -y steamcmd
    - name: Checkout UTMT
      uses: actions/checkout@v7
      with:
        repository: UnderminersTeam/UndertaleModTool
        path: utmt
        ref: ${{ inputs.utmt-ref }}
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Verify UTMT revision
      shell: bash
      env:
        UTMT_REF: ${{ inputs.utmt-ref }}
      run: test "$(git -C utmt rev-parse HEAD)" = "$UTMT_REF"
    - name: Restore UTMT dependencies
      shell: sh
      run: dotnet restore utmt/UndertaleModCli
    - name: Build UTMT CLI
      shell: sh
      run: dotnet build utmt/UndertaleModCli --no-restore
    - name: Publish UTMT CLI
      shell: sh
      run: dotnet publish utmt/UndertaleModCli -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false --output utmtcli
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: canary
    - name: Install viewer dependencies
      shell: sh
      run: bun install --frozen-lockfile
    - name: Install zstd
      shell: sh
      run: sudo apt-get update && sudo apt-get install -y zstd
