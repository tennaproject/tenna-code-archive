<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex">
        <meta name="shard-prefix-length" content="{{ shard_prefix_length }}">
        <title>{{ page_title }}</title>
        <meta name="description" content="{{ og_description }}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Tenna Code Archive">
        <meta property="og:title" content="{{ og_title }}">
        <meta property="og:description" content="{{ og_description }}">
        <meta property="og:url" content="{{ og_url }}">
        <meta property="og:image" content="{{ og_image }}">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="twitter:card" content="summary_large_image">
        <meta property="twitter:title" content="{{ og_title }}">
        <meta property="twitter:description" content="{{ og_description }}">
        <meta property="twitter:url" content="{{ og_url }}">
        <meta property="twitter:image" content="{{ og_image }}">
        <link rel="canonical" href="{{ og_url }}">
        <style>
            :root { color-scheme: dark; }
            body {
                margin: 0;
                background: #211f2b;
                color: #f1f1f1;
            }
            pre {
                box-sizing: border-box;
                max-width: 100%;
                margin: 0;
                padding: 1rem;
                overflow: auto;
                white-space: pre;
                font: 13px/1.45 ui-monospace, monospace;
            }
        </style>
        <script type="module" src="{{ assets['source.js'] }}"></script>
    </head>
    <body>
        <pre id="source-code" aria-busy="true">Loading source…</pre>
    </body>
</html>
