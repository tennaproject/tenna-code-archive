<form method="GET" id="search-form">
    <p class="search-menu">
        <label for="search">Search
            <input type="search" name="search" id="search" size="20" required>
        </label>
        <button type="submit" id="search-submit" class="ui-button ui-button-primary ui-icon-search" disabled>Search</button>
    </p>

    <fieldset>
        <legend>Search options</legend>
        <div class="search-options">
            <label class="search-option" for="case-sensitive">
                <input type="checkbox" name="case-sensitive" id="case-sensitive" aria-describedby="case-sensitive-hint">
                <span>Case sensitive</span>
            </label>
            <label class="search-option" for="is-regex">
                <input type="checkbox" name="is-regex" id="is-regex" aria-describedby="is-regex-hint">
                <span>Regex</span>
            </label>
            <label class="search-option" for="find-all">
                <input type="checkbox" name="find-all" id="find-all" aria-describedby="find-all-hint">
                <span>Find all</span>
            </label>
        </div>
        <div class="option-hints">
            <span class="option-hint" id="case-sensitive-hint">Matches your term exactly.</span>
            <span class="option-hint" id="is-regex-hint">Reads your term as a regular expression.</span>
            <span class="option-hint" id="find-all-hint">Returns every match instead of the first 100, and takes longer.</span>
        </div>
    </fieldset>
</form>
<section class="hidden" id="search-results">
    <h2 class="section-label">Search results</h2>
    <p id="search-status" role="status" aria-live="polite"></p>
    <table>
        <thead>
            <tr>
                <th scope="col">Line</th>
                <th scope="col">Source</th>
            </tr>
        </thead>
        <tbody id="search-hits"></tbody>
    </table>
</section>
