<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f1e2a">
<meta name="shard-prefix-length" content="{{ shard_prefix_length }}">
<title>{{ page_title }}</title>
<meta name="description" content="{{ og_description }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ og_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:title" content="{{ og_title }}">
<meta property="twitter:description" content="{{ og_description }}">
<meta property="twitter:url" content="{{ og_url }}">
<meta property="twitter:image" content="{{ og_image }}">
<link rel="canonical" href="{{ og_url }}">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/pixel-operator/PixelOperator.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/pixel-operator/PixelOperator-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ assets['fonts.css'] }}" />
<link rel="stylesheet" href="{{ assets['main.css'] }}" />
<script type="speculationrules">
{
  "prerender": [
    {
      "where": {
        "or": [
          { "href_matches": "/gml_*.html" },
          { "href_matches": "/*/gml_*.html" }
        ]
      },
      "eagerness": "moderate"
    }
  ]
}
</script>
